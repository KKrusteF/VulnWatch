name: vulnwatch

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vulnwatch
      POSTGRES_USER: vulnwatch
      POSTGRES_PASSWORD: vulnwatch
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnwatch -d vulnwatch"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vulnwatch
      # Optional NVD API key from your shell or a .env file; empty means no key.
      NVD_API_KEY: ${NVD_API_KEY:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
