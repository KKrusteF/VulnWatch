spring:
  application:
    name: vulnwatch
  # Local-dev defaults. Override with environment variables such as SPRING_DATASOURCE_URL
  # (Docker Compose does this to point at the "postgres" container).
  datasource:
    url: jdbc:postgresql://localhost:5432/vulnwatch
    username: vulnwatch
    password: vulnwatch
  elasticsearch:
    # Local-dev default; Docker Compose overrides it with SPRING_ELASTICSEARCH_URIS.
    uris: http://localhost:9200
  kafka:
    # Local-dev default (the host port of the Compose broker); Compose overrides it with SPRING_KAFKA_BOOTSTRAP_SERVERS.
    bootstrap-servers: localhost:9094
    producer:
      # A send counts as done only when every in-sync replica has the message.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Retries inside the producer never write the same message twice.
        enable.idempotence: true
        # Plain JSON without a Java class name header, so any consumer can read it.
        spring.json.add.type.headers: false
    consumer:
      group-id: vulnwatch-indexer
      # A new consumer group starts with the oldest message still in the topic.
      auto-offset-reset: earliest
      # Spring commits the offset after the listener finished, not Kafka on a timer.
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wraps the JSON deserializer so a message that is not valid JSON goes to the error handler
      # (and from there to the dead letter topic) instead of failing the consumer in a loop.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.vulnwatch.events.CveEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.vulnwatch.events
  task:
    scheduling:
      pool:
        # @Scheduled methods share one thread by default, and a long NVD sync would otherwise block the outbox publisher.
        size: 2
  jpa:
    # Do not keep a DB session open while the JSON response is written; all loading happens in services.
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        # Load lazy collections (e.g. vendors) for up to 100 CVEs in one query instead of one query each.
        default_batch_fetch_size: 100
        # Store and read timestamps in UTC regardless of the machine's time zone.
        jdbc:
          time_zone: UTC
          # Send up to 100 INSERT/UPDATE statements to Postgres in one round trip.
          batch_size: 100
        # Group statements by table so batching works across many CVEs and their vendors.
        order_inserts: true
        order_updates: true

management:
  endpoints:
    web:
      exposure:
        # Only expose the harmless actuator endpoints over HTTP.
        include: health,info

vulnwatch:
  nvd:
    # Set to false to turn off the scheduled NVD sync (the tests do this).
    enabled: true
    base-url: https://services.nvd.nist.gov/rest/json/cves/2.0
    # Optional. With a key NVD allows 50 requests per 30 s instead of 5. Empty means no key.
    api-key: ${NVD_API_KEY:}
    # Time between the end of one sync and the start of the next.
    poll-interval: 2h
    # Wait this long after startup before the first sync.
    initial-delay: 10s
    # How far back the very first sync goes when nothing has been synced yet.
    initial-lookback: 7d
    # Each sync re-reads this much before the last cursor, so a CVE modified at the boundary is not missed.
    overlap: 5m
    # CVEs per NVD request (NVD's maximum is 2000).
    results-per-page: 2000
    # Minimum time between two NVD requests: 5 requests per 30 s without an API key.
    request-interval: 6s
    connect-timeout: 10s
    read-timeout: 60s
    # Retry on 429, 5xx and network errors, waiting 6 s, 12 s, 24 s, ... (at most 60 s) between attempts.
    retry:
      max-attempts: 5
      initial-backoff: 6s
      multiplier: 2
      max-backoff: 60s

  search:
    # Name of the Elasticsearch index that holds the searchable copy of every CVE.
    index-name: cves
    # CVEs loaded from Postgres and sent to Elasticsearch per bulk request when rebuilding the index.
    reindex-batch-size: 500

  events:
    # Kafka topic for "CVE created/updated" events; failed events go to <topic>.DLT.
    topic: vulnwatch.cve-events
    # Partitions of the topic: up to this many consumers can index in parallel.
    partitions: 3
    # Set to false to stop the scheduled outbox publisher (the tests do this and publish explicitly).
    publisher-enabled: true
    # Pause between two outbox publishing runs.
    publish-interval: 1s
    # Outbox rows sent per transaction.
    publish-batch-size: 500
    # How long to wait for Kafka to acknowledge a batch before rolling it back.
    send-timeout: 10s
    listener-retry:
      # Elasticsearch unavailable: retry after 1 s, 2 s, 4 s, ... at most 30 s apart, without limit.
      unavailable-initial-backoff: 1s
      unavailable-max-backoff: 30s
      # Any other error: retry this many times this far apart, then send the event to the dead letter topic.
      failure-interval: 1s
      failure-retries: 2
